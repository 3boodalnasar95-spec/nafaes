<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Device Body -->
  <rect x="120" y="100" width="160" height="200" rx="20" fill="#1A1A1A"/>
  <!-- Top Cap -->
  <ellipse cx="200" cy="100" rx="80" ry="20" fill="url(#gold)"/>
  <!-- Screen -->
  <rect x="140" y="140" width="120" height="80" rx="10" fill="#2A2A2A"/>
  <rect x="150" y="150" width="100" height="60" rx="5" fill="#1A1A1A"/>
  <!-- Controls -->
  <circle cx="160" cy="260" r="15" fill="url(#gold)"/>
  <circle cx="200" cy="260" r="15" fill="url(#gold)"/>
  <circle cx="240" cy="260" r="15" fill="url(#gold)"/>
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="16" font-weight="bold">ELAN 360 NOMAD</text>
  <text x="200" y="345" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="12">قابل للشحن</text>
</svg>