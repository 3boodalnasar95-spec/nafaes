<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Device Body - Professional Black -->
  <rect x="100" y="80" width="200" height="240" rx="10" fill="#1A1A1A"/>
  <!-- LCD Screen Circle -->
  <circle cx="200" cy="150" r="50" fill="#2A2A2A" stroke="#333"/>
  <circle cx="200" cy="150" r="40" fill="#1A3A5C"/>
  <text x="200" y="155" text-anchor="middle" fill="#4A9ECC" font-family="Arial" font-size="24" font-weight="bold">LCD</text>
  <!-- Control Buttons -->
  <rect x="130" y="220" width="40" height="25" rx="5" fill="url(#gold)"/>
  <rect x="180" y="220" width="40" height="25" rx="5" fill="url(#gold)"/>
  <rect x="230" y="220" width="40" height="25" rx="5" fill="url(#gold)"/>
  <!-- Bottom Status Bar -->
  <rect x="100" y="310" width="200" height="10" fill="#2ECC71"/>
  <!-- Tube -->
  <rect x="190" y="30" width="20" height="50" fill="#C9A96E"/>
  <ellipse cx="200" cy="30" rx="15" ry="8" fill="#D4AF37"/>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="16" font-weight="bold">NOIR MAJESTÉ</text>
  <text x="200" y="390" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="12">احترافي بشاشة LCD</text>
</svg>