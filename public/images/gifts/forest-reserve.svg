<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="forest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A27"/>
      <stop offset="100%" style="stop-color:#1A3A1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Gift Box -->
  <rect x="100" y="120" width="200" height="150" rx="10" fill="url(#forest)"/>
  <!-- Ribbon -->
  <rect x="190" y="120" width="20" height="150" fill="url(#gold)"/>
  <rect x="100" y="185" width="200" height="20" fill="url(#gold)"/>
  <!-- Bow -->
  <ellipse cx="200" cy="120" rx="30" ry="15" fill="url(#gold)"/>
  <!-- Items inside -->
  <rect x="120" y="280" width="60" height="80" rx="5" fill="#C9A96E"/>
  <rect x="170" y="290" width="50" height="70" rx="5" fill="#8B7355"/>
  <rect x="230" y="285" width="55" height="75" rx="5" fill="#D4AF37"/>
  <!-- Reed sticks -->
  <rect x="130" y="260" width="4" height="30" fill="#8B7355"/>
  <rect x="140" y="255" width="4" height="35" fill="#A08060"/>
  <rect x="150" y="258" width="4" height="32" fill="#8B7355"/>
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="16" font-weight="bold">FOREST RESERVE</text>
  <text x="200" y="390" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="12">طقم هدايا فاخر</text>
</svg>