<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Bottle -->
  <rect x="150" y="100" width="100" height="180" rx="10" fill="url(#rose)"/>
  <!-- Cap -->
  <rect x="175" y="70" width="50" height="35" rx="5" fill="#C9A96E"/>
  <!-- Label -->
  <rect x="160" y="160" width="80" height="60" fill="#FFFFFF"/>
  <text x="200" y="183" text-anchor="middle" fill="#DB2777" font-family="Arial" font-size="12" font-weight="bold">ROSE</text>
  <text x="200" y="200" text-anchor="middle" fill="#DB2777" font-family="Arial" font-size="12" font-weight="bold">MUSK</text>
  <!-- Rose petals decoration -->
  <circle cx="230" cy="240" r="8" fill="#F472B6" opacity="0.3"/>
  <circle cx="220" cy="250" r="5" fill="#F472B6" opacity="0.4"/>
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="14" font-weight="bold">روز مسك</text>
  <text x="200" y="340" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="10">10.900 د.ك</text>
</svg>