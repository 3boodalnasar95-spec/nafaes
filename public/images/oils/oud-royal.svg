<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="royal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Crown decoration -->
  <path d="M175 50 L185 70 L200 55 L215 70 L225 50 L220 80 L180 80 Z" fill="url(#gold)"/>
  <!-- Bottle -->
  <rect x="150" y="100" width="100" height="180" rx="10" fill="url(#royal)"/>
  <!-- Cap with crown -->
  <rect x="175" y="70" width="50" height="35" rx="5" fill="url(#gold)"/>
  <!-- Crown on cap -->
  <circle cx="200" cy="60" r="8" fill="url(#gold)"/>
  <!-- Label -->
  <rect x="160" y="160" width="80" height="60" fill="url(#gold)"/>
  <text x="200" y="185" text-anchor="middle" fill="#1A1A1A" font-family="Arial" font-size="12" font-weight="bold">OUD ROYAL</text>
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="14" font-weight="bold">عود رويال</text>
  <text x="200" y="340" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="10">10.900 د.ك</text>
</svg>