<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="arabian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#654321"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Arabic pattern top -->
  <rect x="160" y="50" width="80" height="20" fill="#C9A96E"/>
  <text x="200" y="65" text-anchor="middle" fill="#1A1A1A" font-family="Arial" font-size="12" font-weight="bold">ARABIC</text>
  <!-- Bottle -->
  <rect x="150" y="100" width="100" height="180" rx="10" fill="url(#arabian)"/>
  <!-- Cap -->
  <rect x="175" y="70" width="50" height="35" rx="5" fill="#C9A96E"/>
  <!-- Label -->
  <rect x="160" y="160" width="80" height="60" fill="#C9A96E"/>
  <text x="200" y="183" text-anchor="middle" fill="#1A1A1A" font-family="Arial" font-size="10" font-weight="bold">ARABIAN</text>
  <text x="200" y="200" text-anchor="middle" fill="#1A1A1A" font-family="Arial" font-size="10" font-weight="bold">OUD</text>
  <!-- Arabic pattern bottom -->
  <rect x="160" y="250" width="80" height="15" fill="#C9A96E"/>
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="14" font-weight="bold">عربي عود</text>
  <text x="200" y="340" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="10">10.900 د.ك</text>
</svg>