<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="linen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FDF4"/>
      <stop offset="100%" style="stop-color:#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Fresh leaves decoration -->
  <ellipse cx="250" cy="70" rx="15" ry="8" fill="#22C55E" opacity="0.5" transform="rotate(-30 250 70)"/>
  <ellipse cx="270" cy="85" rx="12" ry="6" fill="#22C55E" opacity="0.4" transform="rotate(-20 270 85)"/>
  <!-- Bottle -->
  <rect x="150" y="100" width="100" height="180" rx="10" fill="url(#linen)" stroke="#22C55E" stroke-width="2"/>
  <!-- Cap -->
  <rect x="175" y="70" width="50" height="35" rx="5" fill="#22C55E"/>
  <!-- Fresh drop -->
  <ellipse cx="200" cy="190" rx="8" ry="10" fill="#86EFAC" opacity="0.5"/>
  <!-- Label -->
  <rect x="160" y="200" width="80" height="50" fill="#FFFFFF"/>
  <text x="200" y="220" text-anchor="middle" fill="#22C55E" font-family="Arial" font-size="9" font-weight="bold">FRESH</text>
  <text x="200" y="235" text-anchor="middle" fill="#22C55E" font-family="Arial" font-size="9" font-weight="bold">LINEN</text>
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="14" font-weight="bold">فريش لينن</text>
  <text x="200" y="340" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="10">10.900 د.ك</text>
</svg>