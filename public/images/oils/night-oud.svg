<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#2D2D2D"/>
    </linearGradient>
    <linearGradient id="night" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#333333"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="100" cy="50" r="2" fill="#C9A96E" opacity="0.5"/>
  <circle cx="300" cy="80" r="1.5" fill="#C9A96E" opacity="0.4"/>
  <circle cx="80" cy="100" r="1" fill="#C9A96E" opacity="0.3"/>
  <!-- Moon -->
  <circle cx="320" cy="60" r="15" fill="#C9A96E" opacity="0.8"/>
  <!-- Bottle -->
  <rect x="150" y="120" width="100" height="180" rx="10" fill="url(#night)"/>
  <!-- Cap -->
  <rect x="175" y="90" width="50" height="35" rx="5" fill="#C9A96E"/>
  <!-- Label -->
  <rect x="160" y="180" width="80" height="60" fill="#C9A96E"/>
  <text x="200" y="205" text-anchor="middle" fill="#1A1A1A" font-family="Arial" font-size="12" font-weight="bold">NIGHT OUD</text>
  <!-- Label -->
  <text x="200" y="340" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="14" font-weight="bold">نايت عود</text>
  <text x="200" y="360" text-anchor="middle" fill="#888" font-family="Arial" font-size="10">10.900 د.ك</text>
</svg>