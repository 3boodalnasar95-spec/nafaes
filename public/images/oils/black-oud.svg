<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D5"/>
    </linearGradient>
    <linearGradient id="oil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C2C2C"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Bottle -->
  <rect x="150" y="100" width="100" height="180" rx="10" fill="url(#oil)"/>
  <!-- Cap -->
  <rect x="175" y="70" width="50" height="35" rx="5" fill="#C9A96E"/>
  <!-- Label -->
  <rect x="160" y="160" width="80" height="60" fill="#C9A96E"/>
  <text x="200" y="185" text-anchor="middle" fill="#1A1A1A" font-family="Arial" font-size="14" font-weight="bold">BLACK</text>
  <text x="200" y="205" text-anchor="middle" fill="#1A1A1A" font-family="Arial" font-size="14" font-weight="bold">OUD</text>
  <!-- Bottle Shine -->
  <rect x="160" y="110" width="15" height="150" rx="5" fill="#FFFFFF" opacity="0.1"/>
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="#C9A96E" font-family="Arial" font-size="14" font-weight="bold">بلاك عود</text>
  <text x="200" y="340" text-anchor="middle" fill="#6B6B6B" font-family="Arial" font-size="10">10.900 د.ك</text>
</svg>